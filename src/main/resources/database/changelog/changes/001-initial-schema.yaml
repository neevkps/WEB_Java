databaseChangeLog:

  # 1. Створення SEQUENCES
  - changeSet:
      id: 01-create-sequences
      author: space_cat
      changes:
        - createSequence:
            sequenceName: categories_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: customers_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: products_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: orders_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: order_items_seq
            startValue: 1
            incrementBy: 1

  # 2. Таблиця CATEGORIES
  - changeSet:
      id: 02-create-categories-table
      author: space_cat
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('categories_seq')
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  # 3. Таблиця CUSTOMERS
  - changeSet:
      id: 03-create-customers-table
      author: space_cat
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('customers_seq')
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)

  # 4. Таблиця PRODUCTS
  - changeSet:
      id: 04-create-products-table
      author: space_cat
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('products_seq')
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: stock_quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_category
                    references: categories(id)
        # Індекс для FK
        - createIndex:
            tableName: products
            indexName: idx_product_category
            columns:
              - column:
                  name: category_id

  # 5. Таблиця ORDERS
  - changeSet:
      id: 05-create-orders-table
      author: space_cat
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('orders_seq')
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_customer
                    references: customers(id)
              - column:
                  name: total_price
                  type: DECIMAL(19, 2)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        # Індекс для швидкого пошуку замовлень клієнта
        - createIndex:
            tableName: orders
            indexName: idx_order_customer
            columns:
              - column:
                  name: customer_id

  # 6. Таблиця ORDER_ITEMS
  - changeSet:
      id: 06-create-order-items-table
      author: space_cat
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: nextval('order_items_seq')
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_item_order
                    references: orders(id)
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_item_product
                    references: products(id)
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: price_at_purchase
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
        # Індекси
        - createIndex:
            tableName: order_items
            indexName: idx_item_order
            columns:
              - column:
                  name: order_id
        - createIndex:
            tableName: order_items
            indexName: idx_item_product
            columns:
              - column:
                  name: product_id