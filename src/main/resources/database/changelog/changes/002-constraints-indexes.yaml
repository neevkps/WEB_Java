databaseChangeLog:
  - changeSet:
      id: 02-add-product-constraints-and-indexes
      author: space_cat
      changes:
        - addUniqueConstraint:
            tableName: products
            columnNames: name, category_id
            constraintName: uq_product_name_per_category

        # Індекс для пошуку по назві товару
        - createIndex:
            tableName: products
            indexName: idx_product_name
            columns:
              - column:
                  name: name